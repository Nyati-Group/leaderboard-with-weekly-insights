name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cld_db
          POSTGRES_USER: cld_admin
          POSTGRES_PASSWORD: cld_secure_pass_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://cld_admin:cld_secure_pass_2026@localhost:5432/cld_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Seed Script
        env:
          DATABASE_URL: postgresql+psycopg://cld_admin:cld_secure_pass_2026@localhost:5432/cld_db
        run: |
          cd backend
          python -m app.core.seed

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://cld_admin:cld_secure_pass_2026@localhost:5432/cld_db
        run: |
          cd backend
          pytest

  frontend-test:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript & Vite Build
        run: |
          cd frontend
          npm run build
